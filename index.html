 background:radial-gradient(circle,rgba(255,255,255,.08) 0,rgba(255,255,255,.2) 100%);border:3px solid rgba(255,255,255,.5);box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.35)}

/* ================= ABERTURA KUBO6 ================= */
  .intro {
    --paper: #f3f4ef;
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    transition: opacity .35s ease;
  }
  .intro.fadeout { opacity: 0; pointer-events: none; }
  .in-gate { text-align: center; font-family: var(--font-head); color: var(--cyan); padding: 1.5rem; cursor: pointer; }
  .in-gate-title { font-size: clamp(0.75rem, 4vw, 1.125rem); line-height: 1.8; margin: 0 0 1.125rem; text-shadow: 0 0 0.625rem var(--cyan); animation: inBlink 1s steps(2, end) infinite; }
  .in-gate-sub { font-size: 0.5625rem; line-height: 1.8; margin: 0; color: var(--muted); }
  @keyframes inBlink { 50% { opacity: .15; } }

  .in-crt {
    position: absolute; inset: 0; background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    transform: scale(0, .004); visibility: hidden;
  }
  .in-crt.on { visibility: visible; animation: crtOn .7s ease-out forwards; }
  .in-crt.off { animation: crtOff .45s ease-in forwards; }
  @keyframes crtOn {
    0%   { transform: scale(0, .004); filter: brightness(8); }
    35%  { transform: scale(1, .004); filter: brightness(8); }
    100% { transform: scale(1, 1);   filter: brightness(1); }
  }
  @keyframes crtOff {
    0%   { transform: scale(1, 1);    filter: brightness(1); }
    60%  { transform: scale(1, .004); filter: brightness(6); }
    100% { transform: scale(0, .004); filter: brightness(9); }
  }

  .in-stage {
    --ar: 1.16;
    position: relative; overflow: hidden;
    width: min(88vw, 32.5rem, calc(78vh * var(--ar)));
    aspect-ratio: var(--ar);
  }
  .in-stage canvas { display: block; width: 100%; height: 100%; }

  .in-shine { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .in-shine::before {
    content: ""; position: absolute; top: -30%; left: 0; width: 20%; height: 160%; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.97) 50%, rgba(255,255,255,0));
    transform: translateX(-180%) rotate(24deg);
  }
  .in-shine.go::before { animation: inShine .9s cubic-bezier(.45,.1,.3,1) forwards; }
  @keyframes inShine {
    from { opacity: 1; transform: translateX(-180%) rotate(24deg); }
    to   { opacity: 1; transform: translateX(700%)  rotate(24deg); }
  }

  .in-spark { position: absolute; left: 64%; top: 20%; width: 0; height: 0; pointer-events: none; }
  .in-spark::before, .in-spark::after {
    content: ""; position: absolute; left: -0.0625rem; top: -1.875rem; width: 0.125rem; height: 3.75rem;
    background: linear-gradient(transparent, #fff, transparent);
    box-shadow: 0 0 0.625rem 0.125rem rgba(0,200,255,.85);
    transform: scale(0);
  }
  .in-spark::after { transform: rotate(90deg) scale(0); }
  .in-spark.go::before { animation: inSpark .75s ease-out forwards; }
  .in-spark.go::after  { animation: inSpark2 .75s ease-out forwards; }
  @keyframes inSpark  { 0% { transform: scale(0); } 40% { transform: scale(1.25); } 100% { transform: scale(0); } }
  @keyframes inSpark2 { 0% { transform: rotate(90deg) scale(0); } 40% { transform: rotate(90deg) scale(1.25); } 100% { transform: rotate(90deg) scale(0); } }

  .in-scan {
    position: absolute; inset: 0; pointer-events: none; transition: opacity .5s;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 0.0625rem, transparent 0.0625rem 0.1875rem);
  }
  .in-roll {
    position: absolute; left: 0; right: 0; top: -25vh; height: 22vh; pointer-events: none; transition: opacity .5s;
    background: linear-gradient(transparent, rgba(0,0,0,.07), transparent);
    animation: inRoll 2.6s linear infinite;
  }
  @keyframes inRoll { to { transform: translateY(150vh); } }
  .intro.clean .in-scan, .intro.clean .in-roll { opacity: 0; }

  .in-skip {
    position: absolute; left: 0; right: 0; text-align: center; opacity: 0; pointer-events: none; transition: opacity .4s;
    bottom: calc(1.125rem + env(safe-area-inset-bottom, 0rem));
    font-family: var(--font-head); font-size: 0.5625rem; color: #6b6b7a;
  }
  .in-skip.show { opacity: .75; }

  
  @keyframes menuIn {
    from { opacity: 0; filter: brightness(2.4); transform: scale(.97); }
    to   { opacity: 1; filter: none; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .in-roll { display: none; }
    .in-gate-title { animation: none; }
  }
#in-canvas{background:transparent!important}
#mute{display:none!important}

const TRK={

 africa:{bpm:120,root:52,lead:[0,3,5,7,5,3,0,3,7,10,12,10,7,5,3,5],bass:[0,0,0,0,-2,-2,-2,-2],wave:'square'},
 zoo:{bpm:124,root:60,lead:[0,2,4,7,4,2,0,2,4,7,9,7,4,2,4,0],bass:[0,0,-3,-3,-5,-5,-3,-3],wave:'square'},

 bonus:{bpm:150,root:64,lead:[0,4,7,4,0,4,7,12,9,5,9,12,9,5,2,5],bass:[0,0,0,0,5,5,5,5],wave:'square'},

['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(mpCur&&mpCur.paused)mpPlay();},{passive:true}));

// ---------- utilidades de desenho ----------
const _sh={};
function shade(h,a){if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const k=h+a;if(_sh[k])return _sh[k];const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v));
